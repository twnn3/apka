<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق AdobeReader</title>
    <!-- استدعاء مكتبة توليد QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.1) 0px, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 380px;
            width: 100%;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-box {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
        }
        .icon-box svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            font-weight: 700;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        #qrcode {
            background: #ffffff;
            padding: 16px;
            display: inline-block;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-top: 15px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        /* تصميم شاشة التحميل */
        .spinner {
            width: 55px;
            height: 55px;
            border: 4px solid rgba(255,255,255,0.08);
            border-top: 4px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-icon {
            width: 65px;
            height: 65px;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- القسم الأول: عرض الـ QR Code -->
        <div id="qr-section">
            <div class="icon-box">
                <!-- أيقونة مستندات/ملف -->
                <svg viewBox="0 0 24 24"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/></svg>
            </div>
            <h1>تحميل AdobeReader</h1>
            <p>امسح رمز الاستجابة السريعة أدناه بكاميرا هاتفك لبدء التنزيل الفوري:</p>
            
            <div id="qrcode"></div>
            
            <div>
                <span class="badge">آمن وموثوق 100%</span>
            </div>
        </div>

        <!-- القسم الثاني: شاشة التحميل التلقائي -->
        <div id="download-section" class="hidden">
            <div id="load-spinner" class="spinner"></div>
            <div id="load-success" class="success-icon hidden">✓</div>
            <h1 id="dl-title" style="color: #10b981;">جارٍ تجهيز التحميل...</h1>
            <p id="status-text">يتم الآن تحميل ملف <strong>AdobeReader.apk</strong> على هاتفك.</p>
        </div>
    </div>

    <script>
        function checkRoute() {
            if (window.location.hash === '#download') {
                document.getElementById('qr-section').classList.add('hidden');
                document.getElementById('download-section').classList.remove('hidden');
                
                // بدء التحميل التلقائي بعد ثانية ونصف لإعطاء تأثير بصري سلس
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = 'AdobeReader.apk';
                    link.download = 'AdobeReader.apk';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // تغيير الشكل إلى حالة النجاح
                    document.getElementById('load-spinner').classList.add('hidden');
                    document.getElementById('load-success').classList.remove('hidden');
                    document.getElementById('dl-title').innerText = 'تم بدء التنزيل بنجاح!';
                    document.getElementById('status-text').innerHTML = 'يمكنك تفقد شريط الإشعارات لمتابعة تثبيت التطبيق.';
                }, 1500);
            }
        }

        // توليد الـ QR Code ليقود لنفس الصفحة مع وسم #download
        const currentBaseUrl = window.location.href.split('#')[0];
        const targetDownloadUrl = currentBaseUrl + '#download';

        new QRCode(document.getElementById("qrcode"), {
            text: targetDownloadUrl,
            width: 175,
            height: 175,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        window.addEventListener('DOMContentLoaded', checkRoute);
        window.addEventListener('hashchange', checkRoute);
    </script>

</body>
</html>
